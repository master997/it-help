# Render's free tier sleeps a service after ~15 minutes idle, and takes
# ~50 seconds to wake. Slack kills a slash command after 3, so a sleeping
# service means the first question of the day always fails.
#
# Pinging /health every 10 minutes keeps it awake for free.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # lets you trigger it by hand before a demo

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl --silent --show-error --max-time 90 --retry 3 --retry-delay 20 \
            --fail https://it-help-f8gb.onrender.com/health
